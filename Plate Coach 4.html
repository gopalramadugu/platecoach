<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f5c3f">
<title>Plate Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5ef;--card:#fff;--ink:#14281f;--mut:#5d6f64;--line:#dce5da;--pri:#1f5c3f;--onpri:#fff;--gold:#f2b632;--warn:#b3431f;--tip:#fff6dc;--tipb:#e8c766}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#182720;--ink:#e8f0ea;--mut:#98ab9f;--line:#2a3d33;--pri:#5fc08c;--onpri:#0f1a14;--warn:#f08a62;--tip:#2b2610;--tipb:#6b5a1c}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#182720;--ink:#e8f0ea;--mut:#98ab9f;--line:#2a3d33;--pri:#5fc08c;--onpri:#0f1a14;--warn:#f08a62;--tip:#2b2610;--tipb:#6b5a1c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;max-width:640px;margin:0 auto;padding:0 14px 96px}
h1{font-size:26px;font-weight:800;margin:14px 0 2px;letter-spacing:-.5px}h2{font-size:17px;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}.bar i.w{background:var(--warn)}.bar i.g{background:var(--gold)}
.tip{background:var(--tip);border:1px solid var(--tipb);border-radius:12px;padding:11px 13px;margin:10px 0}.tip b{display:block;margin-bottom:3px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.item small{color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:5}
nav button{flex:1;max-width:150px;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}nav button.on{background:var(--pri);color:var(--onpri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
.food{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--line);color:var(--mut);margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 11px;font-size:13px}.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}label{font-size:13px;color:var(--mut)}
</style></head><body>
<div id="app"></div><div id="sheet"></div>
<nav><button data-t="today" class="on">Today</button><button data-t="glu">Glucose</button><button data-t="labs">Labs</button><button data-t="week">Week</button><button data-t="set">Goals</button></nav>
<script>
// name, unit, kcal, protein g, fiber g, carbs g, sat fat g, tip
const F=[
["Chicken curry","1 cup",250,24,2,8,3,"Great protein. Ask for less oil or cream in the gravy and pair with veggies and a fiber side to blunt the sugar rise."],
["Dal / lentil curry","1 cup",230,12,8,35,2,"Star food: lentils bring protein plus soluble fiber that helps lower LDL and slow glucose. Make this a daily habit."],
["Chana masala","1 cup",270,13,10,40,1.5,"Chickpeas are a top pick for blood sugar and cholesterol. Eat it before the rice."],
["Rajma (kidney beans)","1 cup",260,14,9,40,1,"Beans are a double win: fiber for cholesterol, slow carbs for glucose."],
["Paneer curry","1 cup",340,18,3,10,10,"Tasty, but high in saturated fat, which raises LDL. Keep to 1/2 cup or swap for chicken, tofu, or chana now and then."],
["Butter chicken","1 cup",380,26,2,12,12,"Cream and butter make this heavy in saturated fat. Fine occasionally; tandoori chicken or plain chicken curry is the better regular."],
["Lamb / goat curry","1 cup",320,25,2,8,7,"Good protein but more saturated fat. Keep red meat to 1 to 2 times a week and load up on veggies."],
["Veg / palak curry","1 cup",150,5,5,15,2,"Excellent: fiber and volume with few carbs. Add more of these."],
["Basmati rice (white)","1 cup cooked",205,4,0.6,45,0.1,"White rice digests fast. Try 1/2 cup, eat the protein and veggies first, and fill the rest with quinoa. Cooled then reheated rice digests a bit slower."],
["Brown rice","1 cup cooked",215,5,3.5,45,0.4,"Better than white thanks to fiber. Still keep the portion around 1/2 to 1 cup."],
["Quinoa","1 cup cooked",220,8,5,39,0.3,"Good swap: more protein and fiber than rice. Mixing half quinoa, half rice works well."],
["Roti (whole wheat)","1 piece",100,3,3,18,0.5,"Whole wheat gives some fiber. Skip the ghee brushing, and have it with dal or veggies, not alone."],
["Coffee + whole milk","1 cup",38,2,0,3,1.2,"Fine at 2 cups. Skip sugar and keep milk to about 1/4 cup."],
["Coffee + half-and-half","1 cup",40,1,0,1.3,2.3,"Half-and-half is saturated fat that adds up for cholesterol. Using whole milk or less cream is a simple upgrade."],
["Honey","1 tsp",21,0,0,5.7,0,"Honey is still sugar for your glucose. Keep to 1 tsp a day at most, and have it with food, not on its own."],
["Egg","1 large",72,6,0,0.4,1.6,"1 a day is fine for most people. Cook without butter; if your LDL is high, check with your doctor."],
["Chicken breast (grilled)","150 g",250,46,0,0,1.2,"Lean, very high protein. Ideal for muscle: aim for 30 to 40 g per meal."],
["Tandoori chicken","150 g",280,32,0,2,3,"Great option: high protein and no heavy sauce. Add a squeeze of lemon and a salad."],
["Fish (salmon)","150 g",310,34,0,0,3,"Omega-3s help triglycerides and heart health. Aim for fish twice a week."],
["Veggies / salad","1 cup",50,3,4,10,0,"Fill half your plate. Eating veggies first can lower the post-meal glucose rise."],
["Greek yogurt (plain, nonfat)","1 cup",130,22,0,8,0,"Easy protein. Choose plain, and add berries or nuts for fiber."],
["Almonds","1 oz (23)",165,6,3.5,6,1.1,"Good fats and fiber; a small handful helps LDL. Stick to 1 oz."],
["Oats","1/2 cup dry",150,5,4,27,0.5,"Beta-glucan fiber is proven to help lower LDL. Cook plain, add nuts or protein powder."],
["Whey protein scoop","1 scoop",120,24,1,3,1,"Handy after a workout. Mix with water or milk, no sugar added."],
["Apple / berries","1 fruit or cup",85,1,4,22,0,"Whole fruit with fiber beats juice. Pair with nuts or yogurt for a slower rise."],
["Samosa / fried snack","1 piece",260,5,2,24,4,"Fried and refined. Best as a rare treat; try roasted chana or nuts instead."]
];
F.push(
["Poha (veg)","1 cup",250,5,3,45,1,"Flattened rice digests fast. Add peanuts and veggies, pair it with a protein like sprouts or an egg white omelette, and keep it to 1 cup."],
["Upma (veg)","1 cup",220,5,3,35,1.5,"Load it with veggies and use 1 tsp oil. Pair with curd or sprouts for protein."],
["Moong dal chilla","2 pieces",180,12,5,22,1,"Excellent breakfast: protein and fiber with a gentle glucose rise. Cook with 1 tsp oil."],
["Idli","2 pieces",130,4,1.5,26,0.2,"Light but mostly carbs. Always have sambar and a protein with it."],
["Dosa (plain)","1 piece",170,4,1.5,30,1.5,"Refined carbs. Ask for less oil, pair with sambar and a protein side, or try a moong or ragi dosa."],
["Sambar","1 cup",130,7,5,20,1,"Lentils and veggies together. Great with idli or dosa to slow the sugar rise."],
["Egg bhurji (2 eggs)","1 serving",220,13,1,4,3.5,"That is 2 whole eggs and the yolks carry the cholesterol. For your 1-egg plan, use 1 egg plus extra whites and 1 tsp oil."],
["Egg white veg omelette","3 whites",60,11,1,3,0.2,"Lean protein with no yolk cholesterol. A smart way to add protein on top of your 1 whole egg."],
["Mixed veg sabzi","1 cup",110,3,4,12,1,"Bhindi, lauki, cauliflower, beans. Cook with 1 tsp oil and no cream or cashew paste."],
["Sprouts salad","1 cup",120,9,6,20,0.3,"High in protein and fiber, and easy on blood sugar. A great snack or side."],
["Raita (low-fat curd)","1/2 cup",60,4,0,5,1.2,"Cooling protein side. Use low-fat curd to keep saturated fat down."],
["Roasted chana","1/4 cup",180,10,8,28,0.5,"Crunchy, high in fiber and protein. Great for glucose and cholesterol."],
["Chaas (buttermilk)","1 glass",40,3,0,5,1,"Light and hydrating. Skip added sugar."],
["Bajra / ragi roti","1 piece",110,3,3.5,20,0.5,"More fiber than white flour roti. A good swap on rice days."],
["Soya chunks curry","1 cup",240,26,6,15,1,"High protein, no cholesterol, good fiber. A great weekly swap for meat."],
["Fish curry","1 cup",250,25,2,6,2,"Protein plus omega-3s. Make it tomato-based, not heavy coconut cream."],
["Moong khichdi","1 cup",250,10,4,40,1.5,"Comforting and balanced with lentils. Use half rice, add veggies, and have raita on the side."],
["Egg curry (2 eggs)","1 serving",250,13,2,8,3,"That is 2 whole eggs. Use 1 egg with extra gravy veggies, or switch to chicken or dal."]
);
const MEALS=["Breakfast","Lunch","Dinner","Snacks"];
const DEF={t:{kcal:2200,p:140,fib:35,carb:230,sat:15},wt:0};
let S;try{S=JSON.parse(localStorage.getItem("pc1"))}catch(e){}
S=S||{days:{},glu:{},set:DEF};S.days=S.days||{};S.glu=S.glu||{};S.set=S.set||DEF;
const save=()=>{try{localStorage.setItem("pc1",JSON.stringify(S))}catch(e){}};
const ds=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let date=ds(new Date()),tab="today",sel=null,qty=1,meal="Lunch",q="";
const $=id=>document.getElementById(id);
const day=()=>S.days[date]||(S.days[date]={items:[],wo:false});
const r1=n=>Math.round(n*10)/10;
function tot(items){const t={kcal:0,p:0,fib:0,carb:0,sat:0};items.forEach(i=>{const f=gf(i);t.kcal+=f[2]*i.q;t.p+=f[3]*i.q;t.fib+=f[4]*i.q;t.carb+=f[5]*i.q;t.sat+=f[6]*i.q});return t}
function bar(l,v,t,u,max){const p=Math.min(100,v/t*100),w=max&&v>t,c=w?"w":(!max&&v>=t?"":"g");return `<div class="row sp"><span>${l}</span><span class="sub">${Math.round(v)} / ${t}${u}${max?" max":""}</span></div><div class="bar"><i class="${max?(w?'w':''):c}" style="width:${p}%"></i></div>`}
const gf=i=>i.c||F[i.f]||["Removed food","",0,0,0,0,0,""];
const isW=i=>i.f==8, isFib=i=>gf(i)[4]>=3, isVeg=i=>[1,2,3,7,19].includes(i.f), isProt=i=>gf(i)[3]>=15;
function coach(d){
 const it=d.items,t=tot(it),T=S.set.t,L=[],h=new Date().getHours(),today=date==ds(new Date());
 const tp=T.p+(d.wo?15:0);
 if(!it.length){L.push(["Start here","Log your first meal. Build each plate with a protein, a fiber source (veg, dal, beans), then a small portion of rice or quinoa."]);return L}
 MEALS.forEach(m=>{const mi=it.filter(i=>i.m==m);if(mi.some(isW)&&!mi.some(isFib))L.push([m+": rice without fiber","Add veggies, dal, or chana to this meal. Fiber slows the sugar rise from rice."]);
  if(mi.length>1&&!mi.some(isProt)&&mi.some(i=>gf(i)[5]>25))L.push([m+": low protein","Carbs with no protein spike glucose faster. Add chicken, egg, yogurt, or dal."])});
 if(t.sat>T.sat*.8)L.push(["Saturated fat is high","You are at "+Math.round(t.sat)+" g. Cream, paneer, butter, and half-and-half add up. Choose leaner protein for the rest of the day."]);
 if(t.carb>T.carb)L.push(["Carbs over target","Cut the next starch to 1/2 cup and double the veggies."]);
 if(it.filter(i=>i.f==14).reduce((a,i)=>a+i.q,0)>1)L.push(["Honey","More than 1 tsp today. Go easy, it raises glucose like any sugar."]);
 if(it.some(i=>[47,48,49,50,51,52,53,73,74,75,76,77,78,79,80,81,85,188,199,210,216,235,254,272,274,278].includes(i.f)))L.push(["Festival snack","Fried and carb-heavy, so keep to the portion you logged, have it right after a protein meal, and take a 10-minute walk afterwards."]);
 if(it.some(i=>[90,91,94,96,97,98,99,166].includes(i.f)))L.push(["Sugary drink","Sweet coffee drinks and soda can carry 30 to 50 g of sugar. Ask for fewer pumps or sugar-free syrup, a smaller size, or switch to americano or cappuccino."]);
 if(it.some(i=>(i.f>=100&&i.f<=161||i.f>=221)))L.push(["Eating out","Ask for sauce and dressing on the side, take half the rice or noodles, add a vegetable side, and eat the protein and veggies first."]);
 let fc=0;for(let i=0;i<7;i++){const x=new Date();x.setDate(x.getDate()-i);const dd=S.days[ds(x)];if(dd)dd.items.forEach(y=>{if([18,41,46,62,153,212,214].includes(y.f))fc++})}
 if(today&&h>=15&&fc<2)L.push(["Fish this week","You have had "+fc+" fish meal"+(fc==1?"":"s")+" in the last 7 days. Salmon or fish curry twice a week supports triglycerides and LDL."]);
 if(t.sat>T.sat*.5&&it.some(i=>gf(i)[6]>=3))L.push(["Cooking tip for cholesterol","Temper with 1 tsp oil, not ghee. Use a tomato-onion base, and skip cream, butter, and cashew paste in your curries."]);
 if(it.reduce((a,i)=>a+(i.f==15||i.f==113||i.f==249?i.q:(i.f==32||i.f==43||i.f==112||i.f==185||i.f==229||i.f==244)?2*i.q:0),0)>(S.set.t.egg||1))L.push(["Egg yolks","Over your whole-egg limit today. The yolks carry the cholesterol: use egg whites, chicken, fish, or dal for the rest of your protein."]);
 if(today&&h>=15&&t.fib<T.fib*.5)L.push(["Fiber is behind","Add a dal, beans, salad, or fruit with nuts at your next meal."]);
 if(today&&h>=17&&t.p<tp*.6)L.push(["Protein is behind","Make dinner 40 g or more: a chicken breast portion plus Greek yogurt or a shake."]);
 if(d.wo)L.push(["Workout day","Aim for 30 to 40 g protein within 2 hours after training. Your protein target is "+tp+" g today. A little extra carb around training is fine."]);
 L.push(["Habit","Eat veggies and protein first, then carbs. A 10 to 15 minute walk after dinner lowers glucose."]);
 return L.slice(0,4)}
function render(){
 const el=$("app");
 if(tab=="today"){
  const d=day(),t=tot(d.items),T=S.set.t,tp=T.p+(d.wo?15:0);
  el.innerHTML=`<h1>Plate Coach</h1><div class="row sp"><button class="ghost" onclick="mv(-1)">&lsaquo;</button><b>${new Date(date+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</b><button class="ghost" onclick="mv(1)">&rsaquo;</button></div>
  <div class="card"><div class="row sp"><h2>${Math.round(t.kcal)} kcal</h2><button class="ghost" onclick="wo()">${d.wo?"&#10003; Gym day":"Gym day?"}</button></div><div style="height:8px"></div>
  ${bar("Protein",t.p,tp,"g")}${bar("Fiber",t.fib,T.fib,"g")}${bar("Carbs",t.carb,T.carb,"g",1)}${bar("Saturated fat",t.sat,T.sat,"g",1)}</div>
  ${missed(d)}<button class="btn" style="width:100%" onclick="ideasOpen()">What should I eat next?</button>${walkCard(d)}${coach(d).map(c=>`<div class="tip"><b>${c[0]}</b>${c[1]}</div>`).join("")}
  ${MEALS.map(m=>{const mi=d.items.filter(i=>i.m==m);return `<div class="card"><div class="row sp"><h2>${m}</h2><span class="row"><button class="ghost" onclick="rep('${m}')">Repeat last</button><button class="btn" onclick="openSheet('${m}')">+ Add</button></span></div>${mi.map(i=>{const f=gf(i);return `<div class="item"><div>${f[0]} <small>x ${i.q} (${f[1]})</small><br><small>${Math.round(f[2]*i.q)} kcal &middot; P ${r1(f[3]*i.q)} &middot; Fib ${r1(f[4]*i.q)} &middot; C ${r1(f[5]*i.q)}</small></div><button class="x" aria-label="Remove" onclick="del(${i.id})">&times;</button></div>`}).join("")}</div>`}).join("")}`;
 }else if(tab=="glu"){
  const g=S.glu[date]||[];
  el.innerHTML=`<h1>Glucose</h1><p class="sub">Log readings with your meter or CGM. ${date==ds(new Date())?"Today":date}</p>
  <div class="card"><label>Reading (mg/dL)</label><input id="gv" type="number" inputmode="numeric" placeholder="e.g. 98"><div style="height:8px"></div><label>When</label><select id="gt"><option>Fasting</option><option>Before meal</option><option>2h after meal</option><option>Bedtime</option></select><div style="height:8px"></div><label>Which meal? (builds your spike report)</label><select id="gm"><option value="">None</option>${MEALS.map(m=>`<option>${m}</option>`).join("")}</select><div style="height:10px"></div><button class="btn" onclick="addG()">Save reading</button></div>
  <div class="card">${g.length?g.map((x,i)=>`<div class="item"><div><b>${x.v}</b> mg/dL <span class="pill">${x.t}</span>${x.m?`<span class="pill">${x.m}</span>`:""}<br><small>${gnote(x)}</small></div><button class="x" onclick="delG(${i})">&times;</button></div>`).join(""):'<span class="sub">No readings yet today.</span>'}</div>
  ${gins()}<p class="sub">General reference: fasting 70 to 99, and under 140 two hours after eating. Your own targets come from your doctor.</p>`;
 }else if(tab=="labs"){
  const L=(S.labs||[]).slice().sort((a,b)=>a.d<b.d?1:-1),f=[["ldl","LDL","under 100"],["hdl","HDL","over 40"],["tg","Triglycerides","under 150"],["a1c","A1c %","under 5.7"]];
  el.innerHTML=`<h1>Labs</h1><p class="sub">Log blood test results to see if the diet is working.</p><div class="card"><label>Date</label><input id="ld" type="date" value="${ds(new Date())}">${f.map(x=>`<div style="height:8px"></div><label>${x[1]} (common goal: ${x[2]})</label><input id="l_${x[0]}" type="number" step="any" inputmode="decimal">`).join("")}<div style="height:10px"></div><button class="btn" onclick="addL()">Save results</button></div>${L.length?`<div class="card scroll"><table><tr><th>Date</th>${f.map(x=>`<th>${x[1].split(" ")[0]}</th>`).join("")}<th></th></tr>${L.map((r,i)=>`<tr><td>${r.d.slice(5)}</td>${f.map(x=>{const p=L[i+1],v=r[x[0]],d=p&&p[x[0]]!=null&&v!=null?v-p[x[0]]:null;return `<td>${v==null?"-":v}${d?` <small class="sub">${d>0?"+":""}${r1(d)}</small>`:""}</td>`}).join("")}<td><button class="x" onclick="delL(${r.id})">&times;</button></td></tr>`).join("")}</table></div>`:""}<p class="sub">Small numbers show the change from the previous test. Goals vary by person, so ask your doctor for yours.</p>`;
 }else if(tab=="week"){
  const rows=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ds(d),dd=S.days[k],t=tot(dd?dd.items:[]),f=(S.glu[k]||[]).filter(x=>x.t=="Fasting");rows.push(`<tr><td>${d.toLocaleDateString(undefined,{weekday:"short"})}${dd&&dd.wo?" &#127947;":""}</td><td>${Math.round(t.kcal)}</td><td>${Math.round(t.p)}</td><td>${Math.round(t.fib)}</td><td>${Math.round(t.sat)}</td><td>${f.length?f[0].v:"-"}</td></tr>`)}
  const gyms=Object.keys(S.days).filter(k=>S.days[k].wo&&k>ds(new Date(Date.now()-7*864e5))).length;
  el.innerHTML=`<h1>This week</h1><div class="card scroll"><table><tr><th>Day</th><th>kcal</th><th>Protein</th><th>Fiber</th><th>Sat fat</th><th>Fasting</th></tr>${rows.join("")}</table></div><div class="tip"><b>Workouts: ${gyms} of 4 this week</b>Use the Gym day button on Today to track them. Aim for protein and fiber to hit target on most days.</div>`;
 }else{
  const T=S.set.t;
  el.innerHTML=`<h1>Goals</h1><div class="card"><label>Body weight (kg), sets protein at 1.6 g/kg</label><input id="wt" type="number" value="${S.set.wt||""}" placeholder="e.g. 80" onchange="setW(this.value)">
  ${[["kcal","Calories"],["p","Protein (g)"],["fib","Fiber (g)"],["carb","Carbs max (g)"],["sat","Saturated fat max (g)"],["egg","Whole eggs per day"]].map(a=>`<div style="height:8px"></div><label>${a[1]}</label><input type="number" value="${T[a[0]]??(a[0]=="egg"?1:"")}" onchange="setT('${a[0]}',this.value)">`).join("")}</div>

let ph=null;
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PROMPT='You are a registered dietitian. Identify every food in this meal photo and estimate the visible portion. Return ONLY JSON: {"items":[{"name":string,"portion":string,"kcal":number,"p":number,"fib":number,"carb":number,"sat":number,"tip":string}],"note":string}. p, fib, carb, sat are grams for the visible portion. The person eats Indian curries, rice and quinoa, wants lower blood sugar, lower LDL cholesterol and more muscle. tip is one short sentence on that food. note is one or two sentences on how to improve the whole plate (fiber, protein, rice portion, eating order). If there is no food, return an empty items list.';
function snap(){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>i.files[0]&&analyze(i.files[0]);i.click()}
async function shrink(file){const url=URL.createObjectURL(file),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);return new Promise(r=>c.toBlob(r,"image/jpeg",.8))}
async function analyze(file){ph={busy:1};drawSheet();
 try{const sample=window.claude?await claude.use("sample"):null;if(!sample)throw{code:"none"};
  const lim=await sample.limits();if(!lim||!lim.images)throw{code:"none"};
  const blob=await shrink(file);
  const r=await sample.json(PROMPT,{images:[blob],cache:false});
  ph={res:(r.items||[]).slice(0,10),note:r.note||""};if(!ph.res.length)ph={err:"I couldn’t spot food in that photo. Try a closer, well-lit shot from above."}
 }catch(e){ph={err:e&&e.code=="not_granted"?"Access was declined. Allow it when prompted to use photo analysis.":e&&e.code=="none"?"Photo analysis isn’t available in this view. Open the page inside claude.ai.":"Couldn’t read that photo. Try a clearer, closer shot."}}
 drawSheet()}
function drawPh(){const s=$("sheet");let h;
 if(ph.busy)h='<p style="text-align:center;padding:30px 0"><b>Analyzing your photo…</b><br><span class="sub">Estimating portions and macros</span></p>';
 else if(ph.err)h='<div class="tip"><b>Photo not read</b>'+esc(ph.err)+'</div><button class="ghost" onclick="ph=null;drawSheet()">Back</button>';
 else h=ph.res.map((x,i)=>`<div class="food" style="display:block"><label style="color:var(--ink);font-size:15px"><input type="checkbox" style="width:auto" ${x.on===false?"":"checked"} onchange="ph.res[${i}].on=this.checked"> <b>${esc(x.name)}</b> <span class="sub">${esc(x.portion)}</span></label><br><small class="sub">${Math.round(+x.kcal||0)} kcal &middot; P ${r1(+x.p||0)} &middot; Fib ${r1(+x.fib||0)} &middot; C ${r1(+x.carb||0)} &middot; Sat ${r1(+x.sat||0)}</small><br><small>${esc(x.tip)}</small></div>`).join("")+`<div class="tip"><b>Dietitian note</b>${esc(ph.note)}</div><p class="sub">These are AI estimates from a photo, so treat them as ballpark. Uncheck anything wrong.</p><div class="row"><button class="ghost" style="flex:1" onclick="ph=null;drawSheet()">Back</button><button class="btn" style="flex:2" onclick="addPh()">Add to ${meal}</button></div>`;
 s.innerHTML=`<div class="sheet" onclick="if(event.target==this){ph=null;closeSheet()}"><div><div class="row sp"><h2>Photo to ${meal}</h2><button class="ghost" onclick="ph=null;closeSheet()">Close</button></div>${h}</div></div>`}
function addPh(){ph.res.filter(x=>x.on!==false).forEach((x,k)=>day().items.push({id:Date.now()+k,c:[String(x.name),String(x.portion||"1 serving"),+x.kcal||0,+x.p||0,+x.fib||0,+x.carb||0,+x.sat||0,String(x.tip||"")],q:1,m:meal}));ph=null;save();closeSheet();render()}
function drawSheet(){if(ph){drawPh();return}if(nf){drawNf();return}if(idm){drawIdeas();return}
 const s=$("sheet");
 if(sel===null){
  const list=F.concat(S.my||[]).map((f,i)=>[f,i]).filter(a=>a[0][0].toLowerCase().includes(q.toLowerCase())&&inCat(a[1]));
  s.innerHTML=`<div class="sheet" onclick="if(event.target==this)closeSheet()"><div><div class="row sp"><h2>Add to ${meal}</h2><button class="ghost" onclick="closeSheet()">Close</button></div><button class="btn" style="width:100%;margin:10px 0 2px" onclick="snap()">&#128247; Snap or upload a meal photo</button><button class="ghost" style="width:100%;margin:6px 0" onclick="nf=true;drawSheet()">+ New food or recipe</button><div class="scroll" style="display:flex;gap:6px;margin:8px 0;padding-bottom:4px">${CATS.map(c=>`<button class="chip${c[0]==cat?" on":""}" onclick="cat='${c[0]}';drawSheet()">${c[0]}</button>`).join("")}</div><input id="sq" placeholder="Search foods" value="${q}" oninput="q=this.value;drawSheet();$('sq').focus();$('sq').setSelectionRange(q.length,q.length)">${list.map(a=>`<div class="food" onclick="sel=${a[1]};qty=1;drawSheet()"><span>${a[0][0]}<br><small class="sub">${a[0][1]}</small></span><span class="sub">${a[0][2]} kcal &middot; P ${a[0][3]} &middot; F ${a[0][4]}</span></div>`).join("")}</div></div>`;
 }else{
  const f=F.concat(S.my||[])[sel];
  s.innerHTML=`<div class="sheet" onclick="if(event.target==this)closeSheet()"><div><h2>${f[0]}</h2><p class="sub">${f[1]} per 1 serving</p>
  <div class="row" style="justify-content:center;gap:18px;margin:10px 0"><button class="ghost" onclick="qty=Math.max(.25,qty-.25);drawSheet()">&minus;</button><b style="font-size:24px">${qty}</b><button class="ghost" onclick="qty+=.25;drawSheet()">+</button></div>
  <div class="sub" style="text-align:center">${Math.round(f[2]*qty)} kcal &middot; Protein ${r1(f[3]*qty)} g &middot; Fiber ${r1(f[4]*qty)} g &middot; Carbs ${r1(f[5]*qty)} g &middot; Sat fat ${r1(f[6]*qty)} g</div>
  <div class="tip"><b>Dietitian note</b>${f[7]}${qty>=2&&f[5]>=30?" You picked a large serving. Consider halving it.":""}</div>
  <div class="row"><button class="ghost" style="flex:1" onclick="sel=null;drawSheet()">Back</button><button class="btn" style="flex:2" onclick="addIt()">Add to ${meal}</button></div></div></div>`;
 }
}
function addIt(){const A=F.concat(S.my||[]);day().items.push(sel<F.length?{id:Date.now(),f:sel,q:qty,m:meal}:{id:Date.now(),c:A[sel],q:qty,m:meal});save();closeSheet();render()}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render();scrollTo(0,0)}};
render();
</script></body></html>
